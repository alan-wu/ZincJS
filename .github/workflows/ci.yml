name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

  workflow_dispatch:

jobs:
  build:
    name: Build bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build-bundle

      - name: Verify bundle output
        run: |
          test -s build/zinc.js
          test -s build/zinc.js.map
          ls -lh build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Runners have no GPU - Dawn (webgpu package) falls back to Mesa's
      # software Vulkan driver (lavapipe).
      - name: Install software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test-standard
